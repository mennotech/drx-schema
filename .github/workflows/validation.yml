name: validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  module-tests:
    name: Module tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Pester
        shell: pwsh
        run: Invoke-Pester -Path ./Tests/DrX-Schema.Tests.ps1 -Output Detailed

  published-base-image-validation:
    name: Published base image validation
    runs-on: ubuntu-latest
    needs: module-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run published image validation
        shell: pwsh
        run: |
          $result = & ./Tests/Invoke-DrXPublishedBaseImageValidation.ps1 `
            -BaseImage ghcr.io/mennotech/drx-drupal-base:0.0.1-rc1 `
            -ResultDir ./artifacts/published-image-validation `
            -Verbose

          $result | Out-String | Write-Host

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-base-image-validation
          path: ./artifacts/published-image-validation
          if-no-files-found: warn
